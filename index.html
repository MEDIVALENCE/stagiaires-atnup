<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRB - Évaluation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root { --crb: #ED1B2E; --dark: #1a1a1a; --bg: #f4f7f6; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        
        .app-container { width: 100%; max-width: 500px; margin: auto; }
        
        /* HEADER ROUGE CRB */
        .header-top { background: var(--crb); color: white; padding: 20px 15px; border-radius: 15px 15px 0 0; text-align: center; }
        .header-top h1 { margin: 0; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        .header-top p { margin: 5px 0 0; font-size: 14px; opacity: 0.9; }

        .header-logo { background: white; padding: 15px; text-align: center; border-radius: 0 0 15px 15px; margin-bottom: 15px; position: relative; }
        .header-logo img { height: 40px; }
        .settings-btn { position: absolute; top: 10px; right: 15px; font-size: 20px; text-decoration: none; }

        /* SCORE */
        .score-box { background: var(--dark); color: white; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 15px; border: 3px solid var(--crb); }
        .score-val { font-size: 32px; font-weight: 900; color: var(--crb); }

        .card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { font-size: 14px; color: var(--crb); border-bottom: 2px solid #eee; padding-bottom: 8px; margin-bottom: 15px; text-transform: uppercase; }

        label { font-size: 11px; font-weight: bold; color: #666; display: block; margin-bottom: 5px; text-transform: uppercase; }
        select, input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; margin-bottom: 12px; font-size: 16px; background: #fff; }

        /* ITEMS COULEURS */
        .item-row { background: #f9f9f9; padding: 12px; border-radius: 10px; margin-bottom: 10px; border-left: 5px solid var(--crb); }
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .item-label { font-size: 15px; font-weight: bold; color: var(--dark); }
        
        .btns-eval { display: flex; gap: 4px; }
        .btn-val { flex: 1; padding: 12px 2px; border: 1px solid #ddd; background: white; border-radius: 8px; font-size: 10px; font-weight: 800; }
        
        /* Couleurs des notes */
        .btn-val.active[data-pts="1"] { background: #ffcccc; border-color: red; color: red; }
        .btn-val.active[data-pts="2"] { background: #fff3cd; border-color: #ffc107; color: #856404; }
        .btn-val.active[data-pts="3"] { background: #d4edda; border-color: #28a745; color: #155724; }
        .btn-val.active[data-pts="4"] { background: #cce5ff; border-color: #007bff; color: #004085; }
        .btn-val.active[data-pts="0"] { background: #666; border-color: #666; color: white; }

        /* SIGNATURES IPHONE FIX */
        .sig-container { border: 2px dashed #ccc; border-radius: 10px; height: 150px; background: #fff; position: relative; overflow: hidden; touch-action: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; }

        .btn-submit { width: 100%; background: var(--crb); color: white; border: none; padding: 20px; border-radius: 15px; font-size: 18px; font-weight: bold; margin-top: 10px; }
        
        .footer { text-align: center; font-size: 11px; color: #888; margin-top: 20px; padding-bottom: 20px; }
        #loading-overlay { position: fixed; inset: 0; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>

<div id="loading-overlay">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Croix-Rouge_de_Belgique_Logo.svg/1200px-Croix-Rouge_de_Belgique_Logo.svg.png" height="50">
    <p>Connexion sécurisée...</p>
</div>

<div class="app-container">
    <div class="header-top">
        <h1>Croix-Rouge de Belgique</h1>
        <p>Évaluation journalière des candidats</p>
    </div>
    <div class="header-logo">
        <a href="javascript:void(0)" onclick="alert('Laurent JASPARD\n0471/29.07.15')" class="settings-btn">⚙️</a>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Croix-Rouge_de_Belgique_Logo.svg/1200px-Croix-Rouge_de_Belgique_Logo.svg.png">
    </div>

    <div class="score-box">
        <label style="color:white">Note moyenne</label>
        <div id="live_score" class="score-val">NE / 4</div>
    </div>

    <div class="card">
        <h2>Données de mission</h2>
        <label>Stagiaire</label>
        <select id="stag_select" onchange="checkForm()"></select>
        
        <label>École / Qualité</label>
        <select id="ecole_select">
            <option value="CPSI">CPSI</option>
            <option value="PRIGOGINE">PRIGOGINE</option>
            <option value="IFAPME">IFAPME</option>
            <option value="AUTRE">AUTRE</option>
        </select>

        <div style="display:flex; gap:10px;">
            <div style="flex:1;"><label>Type</label><select id="type_stage"><option value="AMU">AMU</option><option value="ATNUP">ATNUP</option></select></div>
            <div style="flex:1;"><label>Jour n°</label><input type="number" id="jour_no" value="1"></div>
        </div>

        <label>Évaluateur (Convoyeur)</label>
        <select id="ms_select" onchange="checkForm()"></select>
        
        <label>Chauffeur</label>
        <select id="chauf_select" onchange="checkForm()"></select>
    </div>

    <div class="card">
        <h2>Compétences</h2>
        <div id="grid_eval"></div>
    </div>

    <div class="card">
        <h2>Commentaires & Signatures</h2>
        <textarea id="obs" rows="4" placeholder="Observations..."></textarea>
        
        <label>Signature Évaluateur</label>
        <div class="sig-container"><canvas id="sig_ms"></canvas></div>
        <button onclick="clearSig('sig_ms')" style="font-size:10px; margin-top:5px;">Effacer</button>
        <br><br>
        <label>Signature Candidat</label>
        <div class="sig-container"><canvas id="sig_st"></canvas></div>
        <button onclick="clearSig('sig_st')" style="font-size:10px; margin-top:5px;">Effacer</button>
        <br><br>
        <button id="btn_send" class="btn-submit" disabled onclick="process()">VALIDER & GÉNÉRER PDF</button>
    </div>

    <div class="footer">
        © MEDIVALENCE 2026 - Laurent Jaspard<br>
        <a href="tel:0471290715">Contact : 0471/29.07.15</a>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx7GPTJk8f8Ozz2ZqQ4fi2dcjJrJt224cuduvSRRhtcAY4TFhvCbch65Z-XOIFCAofr/exec"; // <--- REMPLACER ICI

    const items = [
        {n: "Check up véhicule", h: "Niveaux, carrosserie, propreté."},
        {n: "Check up matériel", h: "O2, brancard, sacs."},
        {n: "Inventaire complet", h: "Péremptions, stocks."},
        {n: "Désinfection", h: "Hygiène cellule et mains."},
        {n: "Itinéraire & GPS", h: "Lecture carte, terminal."},
        {n: "Administratif", h: "Feuille de route, rapports."},
        {n: "Relation équipe", h: "Communication, entraide."},
        {n: "Relation Patient", h: "Empathie, rassurance."},
        {n: "Bilan primaire", h: "ABCDE, fonctions vitales."},
        {n: "Bilan secondaire", h: "Anamnèse, examen physique."},
        {n: "Oxygène", h: "Débit, autonomie, masque."},
        {n: "Manutention", h: "Ergonomie, sécurité."}
    ];

    async function loadData() {
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            fillDrop('stag_select', data.stagiaires);
            fillDrop('ms_select', data.convoyeurs);
            fillDrop('chauf_select', data.chauffeurs);
            document.getElementById('loading-overlay').style.display='none';
        } catch(e) { alert("Erreur de chargement des listes."); }
    }

    function fillDrop(id, list) {
        const s = document.getElementById(id);
        s.innerHTML = '<option value="">-- Choisir --</option>';
        list.forEach(n => s.innerHTML += `<option value="${n}">${n}</option>`);
    }

    function initGrid() {
        const grid = document.getElementById('grid_eval');
        items.forEach(it => {
            grid.innerHTML += `
                <div class="item-row">
                    <div class="item-header">
                        <span class="item-label">${it.n}</span>
                        <button class="btn-info" onclick="alert('${it.h}')">?</button>
                    </div>
                    <div class="btns-eval" data-key="${it.n}">
                        <button class="btn-val" data-pts="1" onclick="setVal(this)">SUF</button>
                        <button class="btn-val" data-pts="2" onclick="setVal(this)">SAT</button>
                        <button class="btn-val" data-pts="3" onclick="setVal(this)">B</button>
                        <button class="btn-val" data-pts="4" onclick="setVal(this)">TB</button>
                        <button class="btn-val active" data-pts="0" onclick="setVal(this)">NE</button>
                    </div>
                </div>`;
        });
    }

    function setVal(btn) {
        Array.from(btn.parentElement.children).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateScore(); checkForm();
    }

    function updateScore() {
        let t=0, c=0;
        document.querySelectorAll('.btn-val.active').forEach(b => {
            let p=parseInt(b.dataset.pts); if(p>0){ t+=p; c++; }
        });
        const res = c>0 ? (t/c).toFixed(1) : "NE";
        document.getElementById('live_score').innerText = `${res} / 4`;
        return res;
    }

    function checkForm() {
        const ok = document.getElementById('stag_select').value && document.getElementById('ms_select').value;
        document.getElementById('btn_send').disabled = !ok;
    }

    // SIGNATURES - FIX IPHONE (Prevent scrolling while signing)
    function setupCanvas(id) {
        const canvas = document.getElementById(id);
        const ctx = canvas.getContext('2d');
        const ratio = window.devicePixelRatio || 1;
        
        function resize() {
            canvas.width = canvas.parentElement.offsetWidth * ratio;
            canvas.height = canvas.parentElement.offsetHeight * ratio;
            ctx.scale(ratio, ratio);
            ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.strokeStyle = "#000";
        }
        window.addEventListener('resize', resize);
        resize();

        let drawing = false;
        const getPos = e => {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        };

        const start = e => { 
            drawing = true; ctx.beginPath(); 
            const p = getPos(e); ctx.moveTo(p.x, p.y); 
            if(e.touches) e.preventDefault(); 
        };
        const move = e => { 
            if(!drawing) return; 
            const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); 
            if(e.touches) e.preventDefault(); 
        };
        const stop = () => drawing = false;

        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mousemove', move);
        window.addEventListener('mouseup', stop);
        canvas.addEventListener('touchstart', start, {passive: false});
        canvas.addEventListener('touchmove', move, {passive: false});
        canvas.addEventListener('touchend', stop);
    }

    function clearSig(id) {
        const c = document.getElementById(id);
        c.getContext('2d').clearRect(0,0,c.width,c.height);
    }

    async function process() {
        const btn = document.getElementById('btn_send');
        btn.innerText = "Enregistrement..."; btn.disabled = true;

        const notes = {};
        document.querySelectorAll('.btns-eval').forEach(el => notes[el.dataset.key] = el.querySelector('.active').innerText);

        const data = {
            stag: document.getElementById('stag_select').value,
            evalNom: document.getElementById('ms_select').value,
            chauf: document.getElementById('chauf_select').value,
            qualite: document.getElementById('ecole_select').value,
            typeS: document.getElementById('type_stage').value,
            jour: document.getElementById('jour_no').value,
            score: updateScore() + " / 4",
            obs: document.getElementById('obs').value || "RAS",
            notes: notes
        };

        // 1. Envoi au Sheets
        try {
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
        } catch(e) {}

        // 2. PDF avec correctif iPhone (Ouvrir dans un nouvel onglet)
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFillColor(237, 27, 46); doc.rect(0, 0, 210, 40, 'F');
        doc.setTextColor(255); doc.setFontSize(18); doc.text("CROIX-ROUGE DE BELGIQUE", 105, 20, {align:'center'});
        doc.setFontSize(12); doc.text("ÉVALUATION JOURNALIÈRE", 105, 30, {align:'center'});

        doc.setTextColor(0); doc.setFontSize(10);
        doc.text(`Candidat: ${data.stag}`, 15, 50);
        doc.text(`Évaluateur: ${data.evalNom}`, 15, 57);
        doc.text(`Score: ${data.score}`, 150, 50);
        doc.text(`Date: ${new Date().toLocaleDateString()}`, 150, 57);

        const rows = Object.entries(notes);
        doc.autoTable({ startY: 65, head: [['Critère', 'Note']], body: rows, headStyles:{fillColor:[237, 27, 46]} });
        
        const finalY = doc.lastAutoTable.finalY + 10;
        doc.text("Observations:", 15, finalY);
        doc.setFontSize(9); doc.text(doc.splitTextToSize(data.obs, 180), 15, finalY + 7);
        
        try {
            doc.addImage(document.getElementById('sig_ms').toDataURL(), 'PNG', 15, finalY + 30, 60, 25);
            doc.addImage(document.getElementById('sig_st').toDataURL(), 'PNG', 130, finalY + 30, 60, 25);
        } catch(e) {}

        // Sauvegarde compatible iPhone
        doc.save(`Evaluation_${data.stag}.pdf`);
        
        alert("Enregistré ! Le PDF a été téléchargé.");
        location.reload();
    }

    window.onload = () => { initGrid(); setupCanvas('sig_ms'); setupCanvas('sig_st'); loadData(); };
</script>
</body>
</html>
