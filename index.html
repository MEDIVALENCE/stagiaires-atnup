<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRB - Évaluation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root { --crb: #ED1B2E; --bleu: #0056b3; --vert: #28a745; --bg: #f0f4f8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #333; }
        
        .header-top { background: var(--crb); color: white; padding: 15px; border-radius: 15px 15px 0 0; text-align: center; }
        .header-logo { background: white; padding: 10px; text-align: center; border-radius: 0 0 15px 15px; margin-bottom: 15px; border-bottom: 4px solid var(--bleu); position: relative; }
        .settings-btn { position: absolute; top: 5px; right: 10px; font-size: 24px; border:none; background:none; }

        .score-box { background: var(--bleu); color: white; padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 15px; font-size: 28px; font-weight: 800; box-shadow: 0 4px 12px rgba(0,86,179,0.3); }

        .card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h2 { font-size: 14px; color: var(--bleu); border-bottom: 2px solid var(--bg); padding-bottom: 5px; margin-top: 0; }

        label { font-size: 11px; font-weight: bold; color: var(--bleu); display: block; margin-bottom: 4px; text-transform: uppercase; }
        select, input, textarea { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 8px; margin-bottom: 10px; font-size: 16px; }

        .item-row { background: #fff; border: 1px solid #e9ecef; padding: 10px; border-radius: 10px; margin-bottom: 8px; border-left: 5px solid var(--vert); }
        .item-label { font-size: 15px; font-weight: bold; margin-bottom: 8px; display: block; }
        
        .btns-eval { display: flex; gap: 3px; }
        .btn-val { flex: 1; padding: 12px 0; border: 1px solid #ddd; background: #f8f9fa; border-radius: 6px; font-size: 10px; font-weight: bold; color: #666; }
        .btn-val.active[data-pts="1"] { background: var(--crb) !important; color: white !important; border-color: var(--crb) !important; }
        .btn-val.active[data-pts="2"] { background: #ffc107 !important; color: #000 !important; border-color: #ffc107 !important; }
        .btn-val.active[data-pts="3"] { background: #8bc34a !important; color: white !important; border-color: #8bc34a !important; }
        .btn-val.active[data-pts="4"] { background: var(--vert) !important; color: white !important; border-color: var(--vert) !important; }
        .btn-val.active[data-pts="0"] { background: #adb5bd !important; color: white !important; border-color: #adb5bd !important; }

        .sig-wrapper { border: 2px solid #ddd; border-radius: 10px; background: #fff; margin-bottom: 10px; }
        .sig-pad { height: 140px; width: 100%; position: relative; touch-action: none; background: #fafafa; }
        canvas { position: absolute; top:0; left:0; width: 100%; height: 100%; }
        .sig-controls { display: flex; justify-content: space-between; padding: 5px; background: #eee; border-radius: 0 0 10px 10px; }
        .btn-sig { padding: 5px 10px; font-size: 11px; font-weight: bold; border-radius: 5px; border: 1px solid #ccc; background: white; }
        .btn-sig.active { background: var(--vert); color: white; border-color: var(--vert); }

        .btn-submit { width: 100%; background: var(--vert); color: white; border: none; padding: 18px; border-radius: 15px; font-size: 18px; font-weight: bold; box-shadow: 0 4px 10px rgba(40,167,69,0.3); }
        .btn-submit:disabled { background: #ccc; box-shadow: none; }
        
        #modal-settings { display: none; position: fixed; inset:0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 100%; }

        #loading-overlay { position: fixed; inset:0; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
    </style>
</head>
<body>

<div id="loading-overlay">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Croix-Rouge_de_Belgique_Logo.svg/1200px-Croix-Rouge_de_Belgique_Logo.svg.png" height="40">
    <p style="color:var(--bleu); font-weight:bold; margin-top:10px;">Synchronisation...</p>
</div>

<div id="modal-settings">
    <div class="modal-content">
        <h3 style="color:var(--bleu); margin-top:0;">Ajouter un Membre</h3>
        <label>Type</label>
        <select id="new_type"><option>Stagiaire</option><option>Convoyeur</option><option>Chauffeur</option></select>
        <label>Nom Complet</label>
        <input type="text" id="new_name" placeholder="Prénom Nom">
        <button onclick="addNewMember()" style="width:100%; padding:12px; background:var(--bleu); color:white; border:none; border-radius:8px; font-weight:bold;">VALIDER L'AJOUT</button>
        <button onclick="toggleModal()" style="width:100%; margin-top:10px; background:none; border:none; color:red; font-size:14px;">Annuler / Fermer</button>
    </div>
</div>

<div class="app-container">
    <div class="header-top">
        <h1 style="margin:0; font-size:18px;">Croix-Rouge de Belgique</h1>
        <p style="margin:5px 0 0; font-size:13px;">Évaluation journalière des candidats</p>
    </div>
    <div class="header-logo">
        <button class="settings-btn" onclick="toggleModal()">⚙️</button>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Croix-Rouge_de_Belgique_Logo.svg/1200px-Croix-Rouge_de_Belgique_Logo.svg.png" height="35">
    </div>

    <div id="live_score" class="score-box">NE / 4</div>

    <div class="card">
        <h2>Identification</h2>
        <label>Stagiaire</label><select id="stag_select" onchange="checkForm()"></select>
        <label>École</label><select id="ecole_select"><option>CPSI</option><option>PRIGOGINE</option><option>IFAPME</option><option>AUTRE</option></select>
        <div style="display:flex; gap:10px;">
            <div style="flex:1;"><label>Type</label><select id="type_stage"><option>AMU</option><option>ATNUP</option></select></div>
            <div style="flex:1;"><label>Jour n°</label><input type="number" id="jour_no" value="1"></div>
        </div>
        <label>Évaluateur (Convoyeur)</label><select id="ms_select" onchange="checkForm()"></select>
        <label>Chauffeur</label><select id="chauf_select" onchange="checkForm()"></select>
    </div>

    <div class="card">
        <h2>Compétences</h2>
        <div id="grid_eval"></div>
    </div>

    <div class="card">
        <h2>Finalisation</h2>
        <textarea id="obs" rows="3" placeholder="Observations..."></textarea>
        
        <label>Signature Évaluateur</label>
        <div class="sig-wrapper">
            <div class="sig-pad"><canvas id="sig_ms"></canvas></div>
            <div class="sig-controls">
                <button class="btn-sig" id="lock_ms" onclick="toggleLock('sig_ms', this)">DÉVERROUILLER POUR SIGNER</button>
                <button class="btn-sig" onclick="clearSig('sig_ms')">Effacer</button>
            </div>
        </div>

        <label>Signature Candidat</label>
        <div class="sig-wrapper">
            <div class="sig-pad"><canvas id="sig_st"></canvas></div>
            <div class="sig-controls">
                <button class="btn-sig" id="lock_st" onclick="toggleLock('sig_st', this)">DÉVERROUILLER POUR SIGNER</button>
                <button class="btn-sig" onclick="clearSig('sig_st')">Effacer</button>
            </div>
        </div>

        <button id="btn_send" class="btn-submit" disabled onclick="process()">ENREGISTRER & PDF</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyOUEXQpzJTrRk_XZmrzVaRDcKYvLxQLK1rXQGURt-qBPb743vsbVenumwjmzdcT1B7/exec";

    const items = [
        "Check up véhicule", "Check up matériel", "Inventaire complet", "Désinfection",
        "Itinéraire & GPS", "Administratif", "Relation équipe", "Relation Patient",
        "Bilan primaire", "Bilan secondaire", "Oxygène", "Manutention"
    ];

    let activePads = { sig_ms: false, sig_st: false };

    // Initialisation au chargement
    window.onload = () => {
        initGrid();
        setupCanvas('sig_ms');
        setupCanvas('sig_st');
        loadData();
    };

    function toggleModal() {
        const m = document.getElementById('modal-settings');
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
    }

    async function loadData() {
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            fillSelect('stag_select', data.stagiaires);
            fillSelect('ms_select', data.convoyeurs);
            fillSelect('chauf_select', data.chauffeurs);
            document.getElementById('loading-overlay').style.display = 'none';
        } catch (e) {
            alert("Erreur de connexion aux données. Vérifiez votre lien SCRIPT_URL.");
        }
    }

    function fillSelect(id, list) {
        const sel = document.getElementById(id);
        sel.innerHTML = '<option value="">-- Sélectionner --</option>';
        list.forEach(item => sel.innerHTML += `<option value="${item}">${item}</option>`);
    }

    function initGrid() {
        const grid = document.getElementById('grid_eval');
        items.forEach(it => {
            grid.innerHTML += `
                <div class="item-row">
                    <span class="item-label">${it}</span>
                    <div class="btns-eval" data-key="${it}">
                        <button class="btn-val" data-pts="1" onclick="setVal(this)">SUF</button>
                        <button class="btn-val" data-pts="2" onclick="setVal(this)">SAT</button>
                        <button class="btn-val" data-pts="3" onclick="setVal(this)">B</button>
                        <button class="btn-val" data-pts="4" onclick="setVal(this)">TB</button>
                        <button class="btn-val active" data-pts="0" onclick="setVal(this)">NE</button>
                    </div>
                </div>`;
        });
    }

    function setVal(btn) {
        const parent = btn.parentElement;
        Array.from(parent.children).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateScore();
        checkForm();
    }

    function updateScore() {
        let total = 0, count = 0;
        document.querySelectorAll('.btn-val.active').forEach(b => {
            let pts = parseInt(b.dataset.pts);
            if(pts > 0) { total += pts; count++; }
        });
        const final = count > 0 ? (total/count).toFixed(1) : "NE";
        document.getElementById('live_score').innerText = final + " / 4";
        return final;
    }

    function checkForm() {
        const ok = document.getElementById('stag_select').value && 
                   document.getElementById('ms_select').value && 
                   document.getElementById('chauf_select').value;
        document.getElementById('btn_send').disabled = !ok;
    }

    function toggleLock(id, btn) {
        activePads[id] = !activePads[id];
        if(activePads[id]) {
            btn.innerText = "✍️ SIGNATURE ACTIVE (Bloqué)";
            btn.classList.add('active');
            document.body.style.overflow = 'hidden';
        } else {
            btn.innerText = "DÉVERROUILLER POUR SIGNER";
            btn.classList.remove('active');
            document.body.style.overflow = 'auto';
        }
    }

    function setupCanvas(id) {
        const canvas = document.getElementById(id);
        const ctx = canvas.getContext('2d');
        const ratio = window.devicePixelRatio || 1;
        
        function resize() {
            canvas.width = canvas.parentElement.offsetWidth * ratio;
            canvas.height = canvas.parentElement.offsetHeight * ratio;
            ctx.scale(ratio, ratio);
            ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.strokeStyle = "#0056b3";
        }
        window.addEventListener('resize', resize);
        resize();

        let drawing = false;
        const getPos = e => {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        };

        const start = e => { if(!activePads[id]) return; drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); };
        const move = e => { if(!drawing || !activePads[id]) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); };
        const stop = () => drawing = false;

        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mousemove', move);
        window.addEventListener('mouseup', stop);
        canvas.addEventListener('touchstart', start, {passive: false});
        canvas.addEventListener('touchmove', move, {passive: false});
        canvas.addEventListener('touchend', stop);
    }

    function clearSig(id) {
        const canvas = document.getElementById(id);
        canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    }

    async function addNewMember() {
        const name = document.getElementById('new_name').value;
        const type = document.getElementById('new_type').value;
        if(!name) return alert("Nom vide !");
        
        document.getElementById('loading-overlay').style.display = 'flex';
        await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ action: "addMember", name: name, type: type })
        });
        alert(name + " ajouté ! Rechargement...");
        location.reload();
    }

    async function process() {
        const btn = document.getElementById('btn_send');
        btn.innerText = "Envoi..."; btn.disabled = true;

        const notes = {};
        document.querySelectorAll('.btns-eval').forEach(el => {
            notes[el.dataset.key] = el.querySelector('.active').innerText;
        });

        const data = {
            stag: document.getElementById('stag_select').value,
            evalNom: document.getElementById('ms_select').value,
            chauf: document.getElementById('chauf_select').value,
            qualite: document.getElementById('ecole_select').value,
            typeS: document.getElementById('type_stage').value,
            jour: document.getElementById('jour_no').value,
            score: updateScore(),
            obs: document.getElementById('obs').value || "RAS",
            notes: notes
        };

        // Envoi Sheets
        try {
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
        } catch(e) {}

        // Génération PDF
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFillColor(237, 27, 46); doc.rect(0, 0, 210, 40, 'F');
        doc.setTextColor(255); doc.setFontSize(18); doc.text("CROIX-ROUGE DE BELGIQUE", 105, 20, {align:'center'});
        doc.setFontSize(12); doc.text("EVALUATION JOURNALIERE", 105, 30, {align:'center'});

        doc.setTextColor(0); doc.setFontSize(10);
        doc.text(`Candidat: ${data.stag}`, 15, 50);
        doc.text(`Evaluateur: ${data.evalNom}`, 15, 57);
        doc.text(`Note: ${data.score}/4`, 150, 50);
        doc.text(`Date: ${new Date().toLocaleDateString()}`, 150, 57);

        const rows = Object.entries(notes);
        doc.autoTable({ startY: 65, head: [['Critère', 'Note']], body: rows, headStyles:{fillColor:[0, 86, 179]} });
        
        const finalY = doc.lastAutoTable.finalY + 10;
        doc.text("Observations:", 15, finalY);
        doc.setFontSize(9); doc.text(doc.splitTextToSize(data.obs, 180), 15, finalY + 7);
        
        try {
            const sigMS = document.getElementById('sig_ms').toDataURL();
            const sigST = document.getElementById('sig_st').toDataURL();
            doc.addImage(sigMS, 'PNG', 15, finalY + 25, 50, 20);
            doc.addImage(sigST, 'PNG', 130, finalY + 25, 50, 20);
        } catch(e) {}

        doc.save(`Evaluation_${data.stag}.pdf`);
        alert("Enregistré avec succès !");
        location.reload();
    }
</script>
</body>
</html>
