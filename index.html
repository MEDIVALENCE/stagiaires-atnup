<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRB - Évaluation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root { --crb: #ED1B2E; --bleu: #0056b3; --vert: #28a745; --bg: #f0f4f8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, sans-serif; 
            background: #d1d9e0; 
            margin: 0; 
            display: flex; 
            justify-content: center;
        }

        .app-container { 
            width: 100%; 
            max-width: 450px; 
            background: var(--bg);
            min-height: 100vh;
            padding: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        
        .header-top { 
            background: var(--crb); 
            color: white; 
            padding: 20px 10px; 
            border-radius: 15px; 
            text-align: center; 
            margin-bottom: 10px;
        }
        .header-top h1 { margin: 0; font-size: 16px; letter-spacing: 1px; font-weight: 900; }
        .header-top h2 { margin: 8px 0 0; font-size: 13px; font-weight: 400; text-transform: uppercase; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 8px; }

        .settings-bar { display: flex; justify-content: flex-end; padding: 0 5px 10px; }
        .settings-btn { font-size: 24px; border:none; background:none; cursor: pointer; filter: grayscale(1); }

        .score-box { 
            background: var(--bleu); 
            color: white; 
            padding: 15px; 
            border-radius: 12px; 
            text-align: center; 
            margin-bottom: 15px; 
            box-shadow: 0 4px 10px rgba(0,86,179,0.2);
        }
        .score-label { font-size: 10px; text-transform: uppercase; opacity: 0.9; margin-bottom: 5px; display: block; }
        .score-num { font-size: 32px; font-weight: 900; }

        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px; border: 1px solid #e0e6ed; }
        .card h3 { font-size: 13px; color: var(--bleu); margin: 0 0 12px 0; text-transform: uppercase; display: flex; align-items: center; }
        .card h3::before { content: "•"; margin-right: 8px; color: var(--crb); font-size: 20px; }

        label { font-size: 10px; font-weight: 700; color: #555; display: block; margin-bottom: 4px; text-transform: uppercase; }
        select, input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 12px; font-size: 15px; background: #fff; }

        .item-row { 
            background: #fff; 
            border: 1px solid #eee; 
            padding: 10px; 
            border-radius: 10px; 
            margin-bottom: 10px; 
            border-left: 5px solid var(--vert);
        }
        .item-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .item-label { font-size: 14px; font-weight: 700; color: #333; }
        
        .info-bubble {
            background: #f0f0f0;
            color: var(--bleu);
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #ddd;
        }

        .btns-eval { display: flex; gap: 4px; }
        .btn-val { flex: 1; padding: 10px 0; border: 1px solid #ddd; background: #fdfdfd; border-radius: 6px; font-size: 10px; font-weight: 800; color: #777; }
        .btn-val.active[data-pts="1"] { background: var(--crb) !important; color: white !important; border-color: var(--crb); }
        .btn-val.active[data-pts="2"] { background: #ffc107 !important; color: #000 !important; border-color: #ffc107; }
        .btn-val.active[data-pts="3"] { background: #8bc34a !important; color: white !important; border-color: #8bc34a; }
        .btn-val.active[data-pts="4"] { background: var(--vert) !important; color: white !important; border-color: var(--vert); }
        .btn-val.active[data-pts="0"] { background: #6c757d !important; color: white !important; border-color: #6c757d; }

        .sig-wrapper { border: 1px solid #ccc; border-radius: 8px; margin-bottom: 12px; background: #fff; }
        .sig-pad { height: 130px; width: 100%; position: relative; touch-action: none; }
        canvas { width: 100%; height: 100%; }
        .sig-controls { display: flex; justify-content: space-between; padding: 6px; background: #f8f9fa; border-top: 1px solid #eee; }
        .btn-sig { padding: 6px 12px; font-size: 11px; font-weight: bold; border-radius: 5px; border: 1px solid #ccc; background: white; }

        .btn-submit { width: 100%; background: var(--vert); color: white; border: none; padding: 18px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 10px rgba(40,167,69,0.2); }
        .btn-submit:disabled { background: #ccc; box-shadow: none; }

        #loading-overlay { position: fixed; inset:0; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--crb); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div class="spinner"></div>
    <p style="font-weight: bold; color: #555;">Synchronisation sécurisée...</p>
</div>

<div class="app-container">
    <div class="header-top">
        <h1>CROIX-ROUGE DE BELGIQUE</h1>
        <h2>ÉVALUATION JOURNALIÈRE DU CANDIDAT</h2>
    </div>

    <div class="settings-bar">
        <button class="settings-btn" onclick="toggleModal()">⚙️</button>
    </div>

    <div class="score-box">
        <span class="score-label">Moyenne Compétences</span>
        <div id="live_score" class="score-num">NE / 4</div>
    </div>

    <div class="card">
        <h3>Identification</h3>
        <label>Candidat / Stagiaire</label><select id="stag_select" onchange="checkForm()"></select>
        <label>Évaluateur (Convoyeur)</label><select id="ms_select" onchange="checkForm()"></select>
        <label>Chauffeur</label><select id="chauf_select" onchange="checkForm()"></select>
        
        <div style="display:flex; gap:10px;">
            <div style="flex:1;"><label>École</label><select id="ecole_select"><option>CPSI</option><option>PRIGOGINE</option><option>IFAPME</option><option>AUTRE</option></select></div>
            <div style="flex:1;"><label>Jour n°</label><input type="number" id="jour_no" value="1"></div>
        </div>
    </div>

    <div class="card">
        <h3>Compétences</h3>
        <div id="grid_eval"></div>
    </div>

    <div class="card">
        <h3>Finalisation</h3>
        <textarea id="obs" rows="3" placeholder="Observations du jour (points forts, points à améliorer)..."></textarea>
        
        <label>Signature Évaluateur</label>
        <div class="sig-wrapper">
            <div class="sig-pad"><canvas id="sig_ms"></canvas></div>
            <div class="sig-controls">
                <button class="btn-sig" id="lock_ms" onclick="toggleLock('sig_ms', this)">DÉVERROUILLER</button>
                <button class="btn-sig" onclick="clearSig('sig_ms')">Effacer</button>
            </div>
        </div>

        <label>Signature Candidat</label>
        <div class="sig-wrapper">
            <div class="sig-pad"><canvas id="sig_st"></canvas></div>
            <div class="sig-controls">
                <button class="btn-sig" id="lock_st" onclick="toggleLock('sig_st', this)">DÉVERROUILLER</button>
                <button class="btn-sig" onclick="clearSig('sig_st')">Effacer</button>
            </div>
        </div>

        <button id="btn_send" class="btn-submit" disabled onclick="process()">VALIDER & EXTRAIRE PDF</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyOUEXQpzJTrRk_XZmrzVaRDcKYvLxQLK1rXQGURt-qBPb743vsbVenumwjmzdcT1B7/exec";

    const items = [
        {id: "Vhc", n: "Check up véhicule", d: "Vérification des niveaux, pneus, carrosserie, propreté et plein de carburant."},
        {id: "Mat", n: "Check up matériel", d: "Test du monitoring, O2, aspiration, matériel de réanimation et bon état du brancard."},
        {id: "Inv", n: "Inventaire complet", d: "Remplacement du matériel utilisé et vérification des dates de péremption des médicaments/consommables."},
        {id: "Hyg", n: "Désinfection / Hygiène", d: "Respect des protocoles de nettoyage de la cellule, lavage des mains et tenue propre."},
        {id: "Nav", n: "Itinéraire & GPS", d: "Utilisation efficace du terminal, anticipation du trajet et conduite sécuritaire."},
        {id: "Adm", n: "Administratif", d: "Remplissage rigoureux de la feuille de route et du rapport d'intervention (SIAMU)."},
        {id: "Equ", n: "Relation équipe", d: "Communication claire avec le binôme, esprit d'initiative et entraide dans les tâches."},
        {id: "Pat", n: "Relation Patient", d: "Qualité de l'accueil, rassurance, discrétion et respect du secret professionnel."},
        {id: "Bi1", n: "Bilan primaire", d: "Mise en sécurité, évaluation de la conscience, respiration, circulation (ABCDE)."},
        {id: "Bi2", n: "Bilan secondaire", d: "Anamnèse complète (SAMPLE), recherche de douleurs et examen physique détaillé."},
        {id: "Oxy", n: "Oxygénothérapie", d: "Connaissance des débits, choix du masque et surveillance de la saturation (SpO2)."},
        {id: "Man", n: "Manutention", d: "Utilisation correcte du matériel de portage et respect des règles d'ergonomie (dos)."}
    ];

    let activePads = { sig_ms: false, sig_st: false };

    window.onload = () => {
        initGrid();
        setupCanvas('sig_ms');
        setupCanvas('sig_st');
        loadData();
    };

    function initGrid() {
        const grid = document.getElementById('grid_eval');
        items.forEach(it => {
            grid.innerHTML += `
                <div class="item-row">
                    <div class="item-header">
                        <span class="item-label">${it.n}</span>
                        <div class="info-bubble" onclick="alert('${it.d.replace(/'/g, "\\'")}')">?</div>
                    </div>
                    <div class="btns-eval" data-key="${it.n}">
                        <button class="btn-val" data-pts="1" onclick="setVal(this)">SUF</button>
                        <button class="btn-val" data-pts="2" onclick="setVal(this)">SAT</button>
                        <button class="btn-val" data-pts="3" onclick="setVal(this)">B</button>
                        <button class="btn-val" data-pts="4" onclick="setVal(this)">TB</button>
                        <button class="btn-val active" data-pts="0" onclick="setVal(this)">NE</button>
                    </div>
                </div>`;
        });
    }

    async function loadData() {
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            fillSelect('stag_select', data.stagiaires);
            fillSelect('ms_select', data.convoyeurs);
            fillSelect('chauf_select', data.chauffeurs);
            document.getElementById('loading-overlay').style.display = 'none';
        } catch (e) { alert("Erreur de connexion aux serveurs Google."); }
    }

    function fillSelect(id, list) {
        const sel = document.getElementById(id);
        sel.innerHTML = '<option value="">-- Sélection --</option>';
        list.forEach(item => sel.innerHTML += `<option value="${item}">${item}</option>`);
    }

    function setVal(btn) {
        Array.from(btn.parentElement.children).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateScore();
        checkForm();
    }

    function updateScore() {
        let t = 0, c = 0;
        document.querySelectorAll('.btn-val.active').forEach(b => {
            let p = parseInt(b.dataset.pts);
            if(p > 0) { t += p; c++; }
        });
        const score = c > 0 ? (t/c).toFixed(1) : "NE";
        document.getElementById('live_score').innerText = score + " / 4";
        return score;
    }

    function checkForm() {
        const ok = document.getElementById('stag_select').value && document.getElementById('ms_select').value;
        document.getElementById('btn_send').disabled = !ok;
    }

    function toggleLock(id, btn) {
        activePads[id] = !activePads[id];
        btn.innerText = activePads[id] ? "VERROUILLER" : "DÉVERROUILLER";
        btn.style.background = activePads[id] ? "var(--vert)" : "white";
        btn.style.color = activePads[id] ? "white" : "black";
        document.body.style.overflow = activePads[id] ? 'hidden' : 'auto';
    }

    function setupCanvas(id) {
        const canvas = document.getElementById(id);
        const ctx = canvas.getContext('2d');
        const ratio = window.devicePixelRatio || 1;
        canvas.width = canvas.parentElement.offsetWidth * ratio;
        canvas.height = canvas.parentElement.offsetHeight * ratio;
        ctx.scale(ratio, ratio);
        ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.strokeStyle = "#000";

        let drawing = false;
        const getPos = e => {
            const rect = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: cx - rect.left, y: cy - rect.top };
        };

        const start = e => { if(!activePads[id]) return; drawing=true; ctx.beginPath(); const p=getPos(e); ctx.moveTo(p.x, p.y); if(e.touches) e.preventDefault(); };
        const move = e => { if(!drawing || !activePads[id]) return; const p=getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); if(e.touches) e.preventDefault(); };
        const stop = () => drawing = false;

        canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', stop);
        canvas.addEventListener('touchstart', start, {passive: false}); canvas.addEventListener('touchmove', move, {passive: false}); canvas.addEventListener('touchend', stop);
    }

    function clearSig(id) {
        const c = document.getElementById(id);
        c.getContext('2d').clearRect(0,0,c.width,c.height);
    }

    async function process() {
        const stag = document.getElementById('stag_select').value;
        const eval = document.getElementById('ms_select').value;
        const btn = document.getElementById('btn_send');
        btn.innerText = "Génération du rapport..."; btn.disabled = true;

        const notes = {};
        document.querySelectorAll('.btns-eval').forEach(el => notes[el.dataset.key] = el.querySelector('.active').innerText);

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFillColor(237, 27, 46); doc.rect(0, 0, 210, 40, 'F');
        doc.setTextColor(255); doc.setFontSize(18); doc.text("CROIX-ROUGE DE BELGIQUE", 105, 20, {align:'center'});
        doc.setFontSize(12); doc.text("ÉVALUATION JOURNALIÈRE DU CANDIDAT", 105, 30, {align:'center'});

        doc.setTextColor(0); doc.setFontSize(11);
        doc.text(`Candidat: ${stag}`, 15, 50);
        doc.text(`Évaluateur: ${eval}`, 15, 57);
        doc.text(`Moyenne: ${updateScore()}/4`, 150, 50);
        doc.text(`Date: ${new Date().toLocaleDateString('fr-BE')}`, 150, 57);

        doc.autoTable({ startY: 65, head: [['Compétence', 'Évaluation']], body: Object.entries(notes), headStyles:{fillColor:[0, 86, 179]} });
        
        const finalY = doc.lastAutoTable.finalY + 10;
        doc.setFontSize(10); doc.text("Observations:", 15, finalY);
        doc.setFontSize(9); doc.text(doc.splitTextToSize(document.getElementById('obs').value || "Aucune observation particulière.", 180), 15, finalY + 7);
        
        doc.setFontSize(10);
        doc.text(`Évaluateur: ${eval}`, 15, finalY + 35); 
        doc.text(`Candidat: ${stag}`, 130, finalY + 35); 
        
        try {
            doc.addImage(document.getElementById('sig_ms').toDataURL(), 'PNG', 15, finalY + 40, 60, 25);
            doc.addImage(document.getElementById('sig_st').toDataURL(), 'PNG', 130, finalY + 40, 60, 25);
        } catch(e) {}

        doc.save(`Eval_CRB_${stag}_${new Date().toLocaleDateString('fr-BE')}.pdf`);
        alert("Enregistrement réussi !");
        location.reload();
    }
</script>
</body>
</html>
